name: cosmetics_store
description: A modern e-commerce app for cosmetic products
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Networking
  dio: ^5.3.3
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  # Navigation
  go_router: ^12.1.1
  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.8.1
  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  # Payments
  flutter_paypal_checkout: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
