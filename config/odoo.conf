[options]
; Admin master password — used for database management
admin_passwd = admin

; Database settings (overridden by Docker env vars)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secret

; Addons path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Logging
log_level = info

; Server settings
xmlrpc_port = 8069
proxy_mode = True

; Performance
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Database management
list_db = True
